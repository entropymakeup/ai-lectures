<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI × OPERATOR — Entropy Makeup</title>
  <meta name="robots" content="noindex, nofollow" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@300;400;500&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- ── PASSWORD GATE ─────────────────────────────────────── -->
  <div id="gate" class="gate">
    <div class="gate__inner">
      <div class="gate__wordmark">ENTROPY</div>
      <div class="gate__series">AI Lecture Series</div>

      <input
        id="pwInput"
        type="password"
        class="gate__input"
        placeholder="ACCESS CODE"
        autocomplete="off"
        spellcheck="false"
      />
      <button id="enterBtn" class="gate__btn">ENTER</button>
      <p id="gateError" class="gate__error"></p>
    </div>
  </div>

  <!-- ── MAIN CONTENT ──────────────────────────────────────── -->
  <div id="main" style="display:none">

    <!-- Hero -->
    <header class="hero">
      <div class="wrap">
        <p class="hero__eyebrow">Entropy Makeup × AI</p>
        <h1 class="hero__title">AI × OPERATOR</h1>
        <p class="hero__subtitle">엔트로피 메이크업 AI 강의 시리즈</p>
        <div class="hero__meta">
          <span id="metaStart">—</span>
          <span class="hero__meta-dot"></span>
          <span id="metaCount">—</span>
        </div>
      </div>
      <div class="wrap"><div class="divider"></div></div>
    </header>

    <!-- Lecture List -->
    <section class="lectures">
      <div class="wrap">
        <div id="lectureGrid"></div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
      <div class="wrap">
        <div class="footer__inner">
          <span class="footer__brand">ENTROPY MAKEUP</span>
          <span class="footer__year" id="footerYear"></span>
        </div>
      </div>
    </footer>

  </div><!-- /main -->

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
